[package]
name = "curio"
version = "0.2.0"
edition = "2021"
description = "The Silicon Circus asset server. Serves every image, model and sound in the park by name, converting on demand, so no repo ever holds a copy of anything."
authors = ["Thomas Sawyer <transfire@gmail.com>"]
license = "MIT"

[[bin]]
name = "curio"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
