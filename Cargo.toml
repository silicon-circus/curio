[package]
name = "curio"
version = "0.4.0"
edition = "2021"
description = "A web UI for DataDungeon stores: filter by tags, see what is there, and curate it. Read-only until you say otherwise."
authors = ["Thomas Sawyer <transfire@gmail.com>"]
license = "MIT"

[[bin]]
name = "curio"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
fast_image_resize = { version = "6.1.0", features = ["image"] }
getrandom = "0.3.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
toml = "0.9"
webp = "0.3.1"
