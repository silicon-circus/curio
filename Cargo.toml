[package]
name = "curio"
version = "0.2.2"
edition = "2021"
description = "The Silicon Circus asset server. Serves every image, model and sound in the park by name, converting on demand, so no repo ever holds a copy of anything."
authors = ["Thomas Sawyer <transfire@gmail.com>"]
license = "MIT"

[[bin]]
name = "curio"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
webp = "0.3.1"
