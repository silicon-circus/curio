<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3.5' y='3.5' width='9' height='9' rx='1.5' transform='rotate(45 8 8)' fill='%231f5f59'/%3E%3C/svg%3E">
<style>
/* curio's console. Compiled into the binary; no fonts, scripts or images from anywhere else.
 *
 * One colour is reserved: red means update mode, and nothing else in the console is red. */
:root {
  --board: #dcdfd8;      /* the drawer: cool archival board, quiet enough for the art to lead */
  --paper: #f5f6f2;      /* label stock */
  --sunk:  #cfd3cb;
  --ink:   #1b201e;
  --mute:  #626c67;
  --rule:  #b8beb6;
  --teal:  #1f5f59;      /* selection and focus */
  --teal-soft: #c3d6d1;
  --amber: #b97a0c;      /* flagged */
  --red:   #d3261e;      /* update mode, and only update mode */
  --red-ink: #fff;
  --check-a: #e9ebe6;
  --check-b: #d6dad3;
  --shadow: 0 1px 0 rgba(27,32,30,.08), 0 8px 24px -12px rgba(27,32,30,.25);

  --display: "URW Gothic", "Century Gothic", "Avant Garde", "Futura", sans-serif;
  --body: system-ui, "Adwaita Sans", Cantarell, "Segoe UI", sans-serif;
  --mono: "Adwaita Mono", ui-monospace, "DejaVu Sans Mono", "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --board: #141716; --paper: #1d2120; --sunk: #101312; --ink: #e2e6e1; --mute: #8d9792;
    --rule: #2f3533; --teal: #63b4aa; --teal-soft: #22403c; --amber: #e0a53a;
    --red: #ef4136; --check-a: #232826; --check-b: #1a1e1d;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--board); color: var(--ink);
  font: 14px/1.45 var(--body);
  display: grid; grid-template-rows: auto auto 1fr; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.mute { color: var(--mute); }
[hidden] { display: none !important; }

/* ── the tent's edge: only there in update mode ─────────────────────────────────────── */
.tent {
  height: 0; overflow: hidden; transition: height .25s ease;
  background: repeating-linear-gradient(-45deg, var(--red) 0 14px, #fff 14px 28px);
}
body.updating .tent { height: 8px; animation: march 1.2s linear infinite; background-size: 40px 40px; }
@keyframes march { to { background-position: 40px 0; } }
@media (prefers-reduced-motion: reduce) { body.updating .tent { animation: none; } .tent { transition: none; } }

/* ── top bar ───────────────────────────────────────────────────────────────────────── */
header {
  display: flex; align-items: center; gap: 18px; padding: 10px 18px;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.mark { font: 600 22px/1 var(--display); letter-spacing: -.01em; margin: 0; }
.mark span { color: var(--mute); font-weight: 400; }
.storepick select {
  font: 600 15px var(--display); background: var(--board); border: 1px solid var(--rule);
  border-radius: 6px; padding: 5px 8px;
}
.search input {
  font: 13px var(--mono); width: 240px; padding: 6px 12px; border: 1px solid var(--rule);
  border-radius: 999px; background: var(--board);
}
.types { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: thin; }
.types button {
  border: 0; background: none; padding: 6px 12px; border-radius: 6px; white-space: nowrap;
  font: 500 15px var(--display);
}
.types button:hover { background: var(--board); }
.types button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.types .n { font: 12px var(--mono); opacity: .65; margin-left: 6px; }

/* ── the switch ────────────────────────────────────────────────────────────────────── */
.switch {
  display: flex; align-items: center; gap: 10px; border: 2px solid var(--red); background: none;
  border-radius: 999px; padding: 4px 6px 4px 14px; font: 700 12px var(--display);
  letter-spacing: .08em; text-transform: uppercase; color: var(--red); min-width: 196px;
  justify-content: space-between;
}
.switch .knob {
  width: 46px; height: 24px; border-radius: 999px; background: var(--sunk); position: relative;
  border: 1px solid var(--rule); flex: none;
}
.switch .knob::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: left .15s ease;
}
.switch[aria-checked="true"] { background: var(--red); color: var(--red-ink); }
.switch[aria-checked="true"] .knob { background: #fff3; border-color: #fff6; }
.switch[aria-checked="true"] .knob::after { left: 24px; }
.switch:disabled { opacity: .45; cursor: not-allowed; }
.switch .fuse { display: block; height: 2px; margin-top: 3px; background: currentColor; transform-origin: left; }
.switch .label { display: flex; flex-direction: column; text-align: left; }
.switch .left { font: 600 11px var(--mono); letter-spacing: 0; text-transform: none; opacity: .85; }

/* ── the three columns ─────────────────────────────────────────────────────────────── */
main { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
main.detailed { grid-template-columns: 250px 1fr 400px; }

aside.filters { overflow-y: auto; padding: 16px 14px 24px; border-right: 1px solid var(--rule); }
.eyebrow {
  font: 700 11px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--mute);
  margin: 0 0 8px;
}
.keyed { font-size: 12.5px; margin: 0 0 14px; color: var(--mute); }
.keyed b { font: 600 12px var(--mono); color: var(--ink); }
.group { border-top: 1px solid var(--rule); }
.group > button {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  border: 0; background: none; padding: 8px 2px; text-align: left; font: 600 12.5px var(--mono);
}
.group > button::before { content: "▸"; color: var(--mute); margin-right: 4px; transition: transform .12s; display: inline-block; }
.group.open > button::before { transform: rotate(90deg); }
.group > button .k { flex: 1; }
.group > button .n { font-weight: 400; color: var(--mute); }
.group.trait > button .k::after { content: " · key"; color: var(--teal); font-weight: 400; }
.values { list-style: none; margin: 0 0 8px; padding: 0; }
.values button {
  width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left;
  border: 0; border-radius: 4px; padding: 3px 6px; font: 12.5px var(--mono);
  /* the bar behind each value is its share of the type: structure that says something true */
  background: linear-gradient(90deg, var(--teal-soft) var(--share), transparent var(--share));
}
.values button:hover { outline: 1px solid var(--rule); }
.values button[aria-pressed="true"] { background: var(--teal); color: var(--paper); }
.values .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.values .more { font: 12px var(--body); color: var(--mute); padding: 2px 6px; }

.health { margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 12px; }
.use { margin-bottom: 18px; display: grid; gap: 6px; font-size: 12.5px; }
.use input[type=text], .linkadd input {
  font: 12.5px var(--mono); padding: 3px 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper);
}
.use input[type=text] { width: 100%; }
.use label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.use label > input[type=text] { flex: 1; min-width: 0; }
.linkadd { margin-top: 6px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--rule); vertical-align: -2px; margin-right: 5px; }
.picedit { display: grid; gap: 8px; margin-top: 8px; font-size: 12.5px; }
.picedit .row { gap: 6px; }
.picedit label { display: inline-flex; align-items: center; gap: 4px; }
.picedit input[type=number], .picedit select {
  font: 12.5px var(--mono); width: 5.2em; padding: 2px 4px; border: 1px solid var(--rule); border-radius: 4px; background: var(--board);
}
.picedit select { width: auto; }
.picedit .what { width: 4.2em; color: var(--mute); }
.linkadd input { width: 8.5em; }
.linkadd input.to { flex: 1; min-width: 6em; }
.health button.plain { margin-right: 6px; }
.report { font-size: 12.5px; margin-top: 8px; }

/* ── the grid ──────────────────────────────────────────────────────────────────────── */
/* ONE SCREEN, NO SCROLLING. The page holds as many cards as fit (see fit()), and the grid's rows and
 * columns share out exactly the space there is. */
section.drawer { display: flex; flex-direction: column; overflow: hidden; padding: 14px 18px; min-width: 0; min-height: 0; }
.status {
  flex: none; display: flex; align-items: center; gap: 10px; height: 34px; margin-bottom: 12px;
  overflow: hidden; white-space: nowrap;
}
.status .count { font: 600 14px var(--display); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--teal); color: var(--teal);
  background: var(--paper); border-radius: 999px; padding: 2px 4px 2px 10px; font: 12px var(--mono);
}
.chip button { border: 0; background: none; color: inherit; padding: 0 5px; font-size: 14px; line-height: 1; }
.grid {
  flex: 1; min-height: 0; display: grid; gap: 14px;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows, 3), minmax(0, 1fr));
}
.card {
  background: var(--paper); border-radius: 8px; overflow: hidden; position: relative; min-height: 0;
  border: 1px solid var(--rule); box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.card:hover { border-color: var(--mute); }
.card.current { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal); }
.card.retired .well, .card.retired .cap .t { opacity: .5; }
.use select { font: 12.5px var(--body); padding: 2px 4px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); }
.card > .hit {
  flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; border: 0; background: none;
  padding: 0; text-align: left; border-radius: 0;
}
.well {
  flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden;
  background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px;
}
.well img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.well .glyph { font: 600 34px var(--display); color: var(--mute); }
.well.missing { background: var(--sunk); }
.well.missing::after { content: "no object"; font: 11px var(--mono); color: var(--mute); }
.cap { flex: none; padding: 7px 9px 8px; display: grid; gap: 1px; }
/* Two full lines, and the name is cut in the MIDDLE to fit them (see fitCaptions): names that share a
 * long prefix differ at the end, which is exactly what a trailing ellipsis hides. */
.cap .t { font: 12px/1.35 var(--mono); word-break: break-all; height: 2.7em; overflow: hidden; }
.cap .s { font-size: 11.5px; color: var(--mute); display: flex; gap: 8px; }
.card .flag {
  position: absolute; top: 8px; left: 8px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--amber); box-shadow: 0 0 0 2px var(--paper);
}
.card .play {
  position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%;
  border: 0; background: var(--ink); color: var(--paper); font-size: 13px;
}
.card .play[aria-pressed="true"] { background: var(--teal); }
.pager { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.pageno { width: 5em; padding: 3px 6px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font: 13px var(--mono); }
.empty { padding: 48px 0; color: var(--mute); max-width: 46ch; grid-column: 1 / -1; }
.empty b { color: var(--ink); }

/* ── the detail panel ──────────────────────────────────────────────────────────────── */
aside.detail { overflow-y: auto; background: var(--paper); border-left: 1px solid var(--rule); padding: 0 0 32px; }
.detail .preview {
  min-height: 220px; display: grid; place-items: center; padding: 14px;
  background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px;
  border-bottom: 1px solid var(--rule); position: relative;
}
.detail .preview img { max-width: 100%; max-height: 52vh; display: block; }
.detail .preview video { max-width: 100%; max-height: 52vh; }
.detail .preview audio { width: 100%; }
.detail .preview pre { white-space: pre-wrap; max-height: 40vh; overflow: auto; margin: 0; width: 100%; font: 12.5px/1.5 var(--mono); }
.detail .close {
  position: absolute; top: 8px; right: 8px; border: 0; width: 30px; height: 30px; border-radius: 50%;
  background: var(--paper); box-shadow: var(--shadow); font-size: 16px;
}
.detail .body { padding: 14px 16px; display: grid; gap: 16px; }
.detail h2 { font: 600 17px/1.25 var(--display); margin: 0; overflow-wrap: anywhere; }
.detail .sub { font-size: 12.5px; color: var(--mute); margin-top: 3px; }
.links { display: flex; gap: 14px; font-size: 12.5px; }
.links a { color: var(--teal); }
table.tags { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
table.tags td { padding: 4px 6px; border-top: 1px solid var(--rule); vertical-align: middle; }
table.tags td.k { color: var(--mute); width: 38%; overflow-wrap: anywhere; }
table.tags td.v { overflow-wrap: anywhere; }
table.tags td.x { width: 1%; white-space: nowrap; text-align: right; }
table.tags input { width: 100%; font: 12.5px var(--mono); padding: 3px 5px; border: 1px solid var(--rule); border-radius: 4px; background: var(--board); }
.badge { font: 600 10px var(--body); letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 1px 5px; margin-left: 6px; }
.badge.custom { background: var(--amber); color: #fff; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
dl.facts dt { color: var(--mute); }
dl.facts dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
details.gen summary { cursor: pointer; font-size: 12.5px; color: var(--mute); }
details.gen pre { font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
textarea { width: 100%; min-height: 88px; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; background: var(--board); resize: vertical; }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; padding: 0 1px; font-size: 18px; line-height: 1; color: var(--rule); }
.stars button.on { color: var(--amber); }
.stars button:disabled { cursor: default; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
button.plain {
  border: 1px solid var(--rule); background: var(--board); border-radius: 6px; padding: 4px 10px; font-size: 12.5px;
}
button.plain:hover { border-color: var(--mute); }
button.go { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.danger { color: var(--red); border-color: var(--red); background: none; }
button.danger:hover { background: var(--red); color: #fff; }
button.tiny { border: 0; background: none; color: var(--mute); padding: 0 4px; font-size: 12px; }
button.tiny:hover { color: var(--ink); }
.note { font-size: 12.5px; color: var(--mute); border-left: 3px solid var(--rule); padding-left: 8px; }
.note.red { border-color: var(--red); color: var(--ink); }

/* ── messages ──────────────────────────────────────────────────────────────────────── */
#toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 10; }
.toast {
  background: var(--ink); color: var(--paper); border-radius: 8px; padding: 9px 14px; font-size: 13px;
  box-shadow: var(--shadow); max-width: min(560px, 90vw);
}
.toast.bad { background: var(--red); color: #fff; }

/* ── narrow screens: filters fold away, the detail panel covers the grid ──────────── */
.filtertoggle { display: none; }
@media (max-width: 900px) {
  header { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
  .types { order: 3; flex-basis: 100%; }
  .search { order: 4; flex-basis: 100%; }
  .search input { width: 100%; }
  .switch { margin-left: auto; min-width: 0; }
  main, main.detailed { grid-template-columns: 1fr; }
  aside.filters { display: none; position: fixed; inset: 0 30% 0 0; background: var(--board); z-index: 5; box-shadow: var(--shadow); }
  body.showfilters aside.filters { display: block; }
  .filtertoggle { display: inline-block; }
  aside.detail { position: fixed; inset: 0; z-index: 6; }
  section.drawer { padding: 12px; }
  .status { height: 76px; flex-wrap: wrap; align-content: center; row-gap: 6px; }
  .grid { gap: 10px; }
}
</style>
</head>
<body>
<div class="tent" aria-hidden="true"></div>
<header>
  <h1 class="mark">curio <span>· DataDungeon</span></h1>
  <label class="storepick"><span hidden>Store</span><select id="store"></select></label>
  <label class="search"><span hidden>Search</span><input type="search" id="q" placeholder="Search: cattacula front night" autocomplete="off" spellcheck="false"></label>
  <nav class="types" id="types" aria-label="Asset types"></nav>
  <button class="switch" id="switch" role="switch" aria-checked="false" disabled>
    <span class="label"><span id="switchword">Update mode off</span><span class="left" id="left"></span><span class="fuse" id="fuse" hidden></span></span>
    <span class="knob" aria-hidden="true"></span>
  </button>
</header>
<main id="main">
  <aside class="filters" id="filters" aria-label="Filters"></aside>
  <section class="drawer" id="drawer" aria-live="polite"></section>
  <aside class="detail" id="detail" hidden aria-label="Asset"></aside>
</main>
<div id="toasts" role="status"></div>

<script>
"use strict";
/* Everything the console knows comes from /api, which is curio passing a DataDungeon store's own
 * answers through. No type or tag name appears in this file: they are read from the store, because
 * every store has different ones and they get renamed. */

const state = {
  stores: [], store: null, types: [], type: null, filters: {}, keys: {},
  assets: [], total: 0, page: 0, limit: 1, layout: null, selected: null, record: null,
  q: "", uses: null, unused: false, retired: null, view: null, counted: null,
  key: null, idle: 600, deadline: 0, editing: null,
};

// ── small helpers ──────────────────────────────────────────────────────────────────────────────

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const $ = (id) => document.getElementById(id);
const fill = (el, ...kids) => el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));
const enc = encodeURIComponent;
const S = () => `/api/stores/${enc(state.store)}`;

function toast(text, bad) {
  const t = h("div", { className: "toast" + (bad ? " bad" : "") }, text);
  $("toasts").append(t);
  setTimeout(() => t.remove(), bad ? 7000 : 3500);
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (state.key) headers["X-Curio-Update"] = state.key;
  if (opts.body) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(path, { ...opts, headers, body: opts.body && JSON.stringify(opts.body) });
  } catch (e) {
    throw new Error("curio is not answering. Is it still running?");
  }
  if (state.key && res.status !== 423) state.deadline = Date.now() + state.idle * 1000;
  const body = await res.json().catch(() => ({}));
  if (res.status === 423) goLocked();
  if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);
  return body;
}

/* What to call an asset. DataDungeon gives assets no names, so: its description; else its tags, in
 * its type's trait order — what its key says, built here rather than read from `pool_key`, which is
 * an index DataDungeon is free to rename or move (deprecated in 0.12); else every tag as k=v. */
function caption(a, tags = a.tags) {
  if (a.description) return a.description;
  tags = tags || {};
  const t = state.types.find((t) => t.name === a.asset_type);
  const traits = (t && t.registration && t.registration.pool_traits) || [];
  if (traits.some((k) => tags[k])) return traits.map((k) => tags[k] ?? "").join(".");
  const all = sortedTags(tags);
  return all.length ? all.map(([k, v]) => `${k}=${v}`).join(" ") : `#${a.id}`;
}
// Fit every caption into its two lines by cutting from the middle, keeping a little of the start
// and as much of the end as fits. The caption's font is monospaced, so one measurement is enough.
function fitCaptions() {
  const all = document.querySelectorAll(".cap .t");
  if (!all.length) return;
  const probe = h("span", { className: "t", style: "position:absolute; visibility:hidden; height:auto; white-space:pre" }, "0".repeat(40));
  all[0].parentNode.append(probe);
  const perLine = Math.max(6, Math.floor(all[0].clientWidth / (probe.getBoundingClientRect().width / 40)));
  probe.remove();
  for (const el of all) el.textContent = middle(el.dataset.full, perLine * 2);
}
function middle(text, max) {
  if (text.length <= max) return text;
  const head = Math.max(4, Math.floor((max - 1) * 0.3));
  return text.slice(0, head) + "…" + text.slice(text.length - (max - 1 - head));
}
function glyph(a) {
  return { audio: "♪", video: "▶", text: "¶" }[a.media] || "◇";
}
function isRaster(ct) { return /^image\/(png|jpeg|webp|gif)/.test(ct || ""); }
function thumbURL(a, px) {
  const w = Math.min(1024, Math.ceil(px * (window.devicePixelRatio || 1)));
  return `${S()}/assets/${a.id}/thumb/${a.file_hash}?w=${w}`;
}
function objectURL(a, download) {
  return `${S()}/assets/${a.id}/object${download ? "?download=1" : ""}`;
}
function writable() {
  const s = state.stores.find((s) => s.name === state.store);
  return !!(s && s.writable);
}
function updating() { return !!state.key && writable(); }

// ── where we are, kept in the URL so a reload comes back to it (but never in update mode) ─────

function saveHash() {
  const p = new URLSearchParams();
  if (state.store) p.set("store", state.store);
  if (state.type) p.set("type", state.type); else if (state.types.length) p.set("type", "*");
  if (state.q) p.set("q", state.q);
  if (state.uses) p.set("uses", state.uses);
  if (state.unused) p.set("unused", "1");
  if (state.retired) p.set("retired", state.retired);
  if (state.view) p.set("view", state.view);
  for (const [k, v] of Object.entries(state.filters)) p.set("tag." + k, v);
  if (state.page) p.set("page", state.page + 1);
  if (state.selected) p.set("id", state.selected);
  history.replaceState(null, "", "#" + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const filters = {};
  for (const [k, v] of p) if (k.startsWith("tag.")) filters[k.slice(4)] = v;
  return { store: p.get("store"), type: p.get("type"), filters, id: Number(p.get("id")) || null,
           page: Math.max(0, (Number(p.get("page")) || 1) - 1),
           q: p.get("q") || "", uses: p.get("uses"), unused: p.get("unused") === "1",
           retired: ["only", "include"].includes(p.get("retired")) ? p.get("retired") : null,
           view: p.get("view") };
}

// ── stores and types ───────────────────────────────────────────────────────────────────────────

async function start() {
  let got;
  try { got = await api("/api/stores"); }
  catch (e) { fill($("drawer"), h("p", { className: "empty" }, e.message)); return; }
  state.stores = got.stores;
  state.idle = got.idle_seconds;
  const want = readHash();
  if (!state.stores.length) {
    fill($("drawer"), h("div", { className: "empty" },
      h("p", null, h("b", null, "No stores yet. "), "curio shows the DataDungeon stores listed in its config."),
      h("p", null, "Add a ", h("code", null, "[[store]]"), " with a name and url to ",
        h("code", null, "~/.config/curio/curio.toml"), ", then restart curio. Run ",
        h("code", null, "curio --stores"), " to check each one answers.")));
    return;
  }
  const sel = $("store");
  fill(sel, ...state.stores.map((s) => h("option", { value: s.name }, s.name + (s.writable ? "" : " · read-only"))));
  sel.addEventListener("change", () => openStore(sel.value, {}));
  $("switch").disabled = !state.stores.some((s) => s.writable);
  if ($("switch").disabled) $("switch").title = "No store in curio's config has a write token.";
  const first = state.stores.some((s) => s.name === want.store) ? want.store : state.stores[0].name;
  await openStore(first, want);
}

async function openStore(name, want) {
  state.store = name;
  $("store").value = name;
  state.type = null; state.types = [];
  state.q = want.q || ""; $("q").value = state.q;
  state.uses = want.uses || null; state.unused = !!want.unused; state.retired = want.retired || null;
  state.view = want.view || null;
  closeDetail(true);
  renderSwitch();
  try {
    state.types = await api(`${S()}/types`);
  } catch (e) {
    fill($("types"));
    fill($("filters"));
    fill($("drawer"), h("div", { className: "empty" },
      h("p", null, h("b", null, `${name} isn't answering. `), e.message),
      h("p", null, "Check the store is running, then ", h("button", { className: "plain", onclick: () => openStore(name, want) }, "try again"), ".")));
    return;
  }
  renderTypes();
  if (!state.types.length) {
    fill($("filters"));
    fill($("drawer"), h("p", { className: "empty" }, `${name} has no assets yet.`));
    return;
  }
  // Every type: asked for in the URL, or implied by a search with no type.
  const all = want.type === "*" || (!want.type && state.q);
  const chosen = all ? null : (state.types.find((t) => t.name === want.type)
    || state.types.find((t) => t.count > 0) || state.types[0]);
  await openType(chosen && chosen.name, want.filters || {}, want.id, want.page);
}

// "All" first: every type at once, which is where a search starts.
function renderTypes() {
  const total = state.types.reduce((n, t) => n + t.count, 0);
  fill($("types"),
    h("button", { "aria-pressed": String(state.type === null), onclick: () => openType(null, {}) },
      "All", h("span", { className: "n" }, total)),
    ...state.types.map((t) =>
      h("button", { "aria-pressed": String(t.name === state.type), onclick: () => openType(t.name, {}),
        title: t.retired ? `${t.count} current, ${t.retired} retired` : null },
        t.name, h("span", { className: "n" }, t.count))));
}

// `name` null is every type. Tag filters belong to one type, so they start empty on a change of
// type; a search and the use filters cross types, so they stay.
async function openType(name, filters, id, page) {
  state.type = name;
  state.filters = name ? { ...filters } : {};
  state.keys = {};
  renderTypes();
  closeDetail(true);
  await Promise.all([loadKeys(), loadAssets(page || 0)]);
  if (id) select(id);
  saveHash();
}

// ── filters ────────────────────────────────────────────────────────────────────────────────────

function registration() {
  const t = state.types.find((t) => t.name === state.type);
  return t && t.registration;
}

async function loadKeys() {
  const box = $("filters");
  const close = h("button", { className: "plain filtertoggle", onclick: () => document.body.classList.remove("showfilters") }, "Close");
  if (!state.type) {
    fill(box, close, useFilters(),
      h("p", { className: "eyebrow" }, "Filter by tag"),
      h("p", { className: "mute" }, "Tags belong to a type. Choose one above to filter by its tags."),
      health());
    return;
  }
  let counts = {};
  try { counts = await api(`${S()}/types/${enc(state.type)}/tags${state.retired ? "?retired=" + state.retired : ""}`); }
  catch (e) { toast(e.message, true); }
  const reg = registration();
  const traits = (reg && reg.pool_traits) || [];
  // A registered type's key traits first, in the order that makes its key; then the rest.
  const names = [...traits.filter((k) => k in counts), ...Object.keys(counts).filter((k) => !traits.includes(k)).sort()];
  fill(box, close, useFilters(),
    h("p", { className: "eyebrow" }, "Filter by tag"),
    traits.length ? h("p", { className: "keyed" }, "Keyed by ", ...traits.flatMap((t, i) => [i ? " · " : "", h("b", null, t)])) : null,
    ...names.map((k) => group(k, counts[k], traits.includes(k))),
    names.length ? null : h("p", { className: "mute" }, `No ${state.type} carries a tag.`),
    health());
  // Open the groups already filtered on, and the first few, so the column is useful at a glance.
  for (const [i, k] of names.entries()) if (k in state.filters || i < 3) toggleGroup(k, true);
}

function group(key, count, trait) {
  return h("div", { className: "group" + (trait ? " trait" : ""), "data-key": key },
    h("button", { "aria-expanded": "false", onclick: () => toggleGroup(key) },
      h("span", { className: "k" }, key), h("span", { className: "n" }, count)),
    h("ul", { className: "values", hidden: true }));
}

async function toggleGroup(key, open) {
  const g = [...document.querySelectorAll(".group")].find((g) => g.dataset.key === key);
  if (!g) return;
  const list = g.querySelector(".values");
  const willOpen = open ?? list.hidden;
  g.classList.toggle("open", willOpen);
  g.firstChild.setAttribute("aria-expanded", String(willOpen));
  list.hidden = !willOpen;
  if (!willOpen || state.keys[key]) return renderValues(key);
  try { state.keys[key] = await api(`${S()}/types/${enc(state.type)}/tags/${enc(key)}?limit=100${state.retired ? "&retired=" + state.retired : ""}`); }
  catch (e) { toast(e.message, true); state.keys[key] = {}; }
  renderValues(key);
}

function renderValues(key) {
  const g = [...document.querySelectorAll(".group")].find((g) => g.dataset.key === key);
  const vals = state.keys[key];
  if (!g || !vals) return;
  const max = Math.max(1, ...Object.values(vals));
  const entries = Object.entries(vals);
  fill(g.querySelector(".values"), 
    ...entries.map(([v, n]) => h("li", null,
      h("button", {
        "aria-pressed": String(state.filters[key] === v),
        style: `--share:${Math.round((n / max) * 100)}%`,
        title: `${key}=${v}`,
        onclick: () => setFilter(key, state.filters[key] === v ? null : v),
      }, h("span", { className: "v" }, v), h("span", null, n)))),
    entries.length >= 100 ? h("li", { className: "more" }, "The 100 most common values.") : null);
}

function setFilter(key, value) {
  if (value == null) delete state.filters[key]; else state.filters[key] = value;
  for (const k of Object.keys(state.keys)) renderValues(k);
  closeDetail(true);
  loadAssets(0);
}

function clearFilters() {
  state.filters = {};
  state.q = ""; $("q").value = "";
  state.uses = null; state.unused = false; state.retired = null; state.view = null;
  refreshUse();
  setFilter("", null);
}

/* WHO USES AN ASSET is a link, not a tag: `used-by` boardwalk. It is kept out of the key because use
 * changes and one asset can have several users, so it filters across every type. */
function useFilters() {
  const by = h("input", { type: "text", value: state.uses || "", placeholder: "boardwalk, boardwalk.*", "aria-label": "Used by",
    title: "A name, or name.* for it and every area under it (boardwalk.holidayland), or start* for any name starting so",
    onkeydown: (e) => { if (e.key === "Enter") setUse(e.target.value.trim() || null, false); } });
  return h("div", { className: "use" },
    h("p", { className: "eyebrow", style: "margin:0" }, "Use"),
    h("label", null, "Used by", by),
    h("label", null, h("input", { type: "checkbox", checked: state.unused, onchange: (e) => setUse(null, e.target.checked) }),
      "Used by nothing"),
    h("label", null, "Seen", h("select", { "aria-label": "Seen from", onchange: (e) => setView(e.target.value || null) },
      h("option", { value: "", selected: !state.view }, "from anywhere"),
      ...DIRECTIONS.map((d) => h("option", { value: d, selected: state.view === d }, d)))),
    h("label", null, "Show", h("select", { "aria-label": "Show retired", onchange: (e) => setRetired(e.target.value || null) },
      ...[["", "current"], ["only", "retired"], ["include", "current and retired"]].map(([v, label]) =>
        h("option", { value: v, selected: (state.retired || "") === v }, label)))));
}

/* RETIRED assets are hidden and kept: superseded by a newer take, or retired by hand as curation's
 * everyday soft delete. Listings and counts leave them out unless asked. */
/* WHICH FACE OF A THING A PICTURE SHOWS. DataDungeon stores a view as a direction and names it by
 * sector: eight around the thing, "from-above"/"from-below" past 22.5°, "top-down"/"bottom-up" near
 * the poles. A name filters on its sector; the readable numbers are quarter turns (1 = 90°). */
const AROUND = ["front", "front-right", "right", "back-right", "back", "back-left", "left", "front-left"];
const DIRECTIONS = [...AROUND, "from-above", "from-below", "top-down", "bottom-up"];
// The middle of each sector, as DataDungeon's readable form: side, yaw toward the thing's right on
// either face, pitch up from level.
const PRESETS = {
  "front": ["front", 0, 0], "front-right": ["front", 0.5, 0], "right": ["front", 1, 0], "back-right": ["back", 0.5, 0],
  "back": ["back", 0, 0], "back-left": ["back", -0.5, 0], "left": ["front", -1, 0], "front-left": ["front", -0.5, 0],
  "top-down": ["front", 0, 1], "bottom-up": ["front", 0, -1],
};

function setView(view) {
  state.view = view;
  refreshUse();
  closeDetail(true);
  loadAssets(0);
}

function setRetired(retired) {
  state.retired = retired;
  state.keys = {};
  closeDetail(true);
  if (state.type) loadKeys();
  loadAssets(0);
}

function setUse(uses, unused) {
  state.uses = uses;
  state.unused = unused;
  refreshUse();
  closeDetail(true);
  loadAssets(0);
}

function refreshUse() {
  const old = document.querySelector(".use");
  if (old) old.replaceWith(useFilters());
}

/* SEARCH. Every word must be the asset's type or one of its tag values, in any order, so
 * `boardwalk cattacula front`, `cattacula night` and `cattacula.front.night` all find a key that
 * starts with the type. `catt*` matches the start of a word. A search starts across every type;
 * choosing a type tab then narrows it. */
let searching;
$("q").addEventListener("input", () => { clearTimeout(searching); searching = setTimeout(search, 300); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(searching); search(); } });
function search() {
  const q = $("q").value.trim();
  if (q === state.q) return;
  const starting = !state.q && q;
  state.q = q;
  closeDetail(true);
  if (starting && state.type) return openType(null, {});
  loadAssets(0);
}

function health() {
  const out = h("div", { className: "report" });
  const box = h("div", { className: "health" },
    h("p", { className: "eyebrow" }, "Store health"),
    h("div", { className: "row" },
      h("button", { className: "plain", onclick: () => check(out) }, "Check store"),
      updating() ? h("button", { className: "plain danger", onclick: () => cleanUp(out) }, "Clean up…") : null,
      updating() && retiredHere() ? h("button", { className: "plain danger", onclick: () => prune(out) },
        `Prune ${retiredHere()} retired…`) : null,
      updating() ? h("button", { className: "plain", title: "Size, transparency, dominant colour and visible box, for pictures not yet measured",
        onclick: () => measure(out) }, "Measure pictures") : null),
    out);
  return box;
}

function retiredHere() {
  const t = state.types.find((t) => t.name === state.type);
  return (t && t.retired) || 0;
}

async function prune(out) {
  const n = retiredHere();
  if (!confirm(`Delete the ${n} retired ${state.type} in ${state.store} for good?\n\nTheir objects go too, unless another asset shares the bytes. This can't be undone.`)) return;
  out.textContent = "Pruning…";
  try {
    const got = await api(`${S()}/prune`, { method: "POST", body: { type: state.type } });
    out.textContent = `Pruned ${got.pruned ?? n} retired ${state.type}.`;
    state.types = await api(`${S()}/types`).catch(() => state.types);
    renderTypes();
    state.counted = null;
    loadAssets(state.page);
  } catch (e) { out.textContent = e.message; }
}

async function measure(out) {
  out.textContent = "Measuring…";
  try {
    const got = await api(`${S()}/measure`, { method: "POST", body: state.type ? { type: state.type } : {} });
    out.textContent = `Measured ${got.measured} picture${got.measured === 1 ? "" : "s"}.`;
    if (state.record) { state.record = await api(`${S()}/assets/${state.record.asset.id}`); renderDetail(); }
  } catch (e) { out.textContent = e.message; }
}

async function check(out) {
  out.textContent = "Checking…";
  try { showReport(out, await api(`${S()}/check`, { method: "POST" }), false); }
  catch (e) { out.textContent = e.message; }
}

function showReport(out, r, acted) {
  const missing = r.missing_objects.length, orphans = r.orphan_objects.length;
  fill(out, 
    !missing && !orphans ? h("p", null, "Every asset has its object, and every object belongs to an asset.") : null,
    missing ? h("p", null, `${missing} asset${missing === 1 ? " has" : "s have"} no object${acted ? " — removed" : ""}: `,
      h("span", { className: "mono" }, r.missing_objects.slice(0, 12).map((a) => "#" + a.id).join(" ") + (missing > 12 ? " …" : ""))) : null,
    orphans ? h("p", null, `${orphans} object${orphans === 1 ? "" : "s"} belong${orphans === 1 ? "s" : ""} to no asset${acted ? " — deleted" : ""}.`) : null);
}

async function cleanUp(out) {
  const rows = confirm(`Clean up ${state.store}?\n\nOK removes assets whose object is missing, and deletes objects no asset uses. This can't be undone.`);
  if (!rows) return;
  out.textContent = "Cleaning up…";
  try {
    showReport(out, await api(`${S()}/vacuum`, { method: "POST", body: { delete_missing_rows: true, delete_orphan_objects: true } }), true);
    toast(`Cleaned up ${state.store}.`);
    state.counted = null;
    loadAssets(state.page);
  } catch (e) { out.textContent = e.message; }
}

// ── the grid ───────────────────────────────────────────────────────────────────────────────────

/* PAGES, NOT AN ENDLESS SCROLL, AND EACH ONE EXACTLY A SCREEN. A store can hold far more than a
 * browser wants in one grid, so a page is as many cards as fit the space the grid has: as many
 * columns as fit at the smallest card worth looking at, then as many rows of near-square pictures as
 * fit under them. The page number is in the URL, so it is somewhere you can come back to. */
const narrow = () => innerWidth <= 900;

function skeleton() {
  if (!$("grid")) fill($("drawer"), h("div", { id: "status", className: "status" }), h("div", { id: "grid", className: "grid" }));
}

function fit() {
  skeleton();
  const g = $("grid"), gap = narrow() ? 10 : 14, smallest = narrow() ? 120 : 160;
  const W = g.clientWidth, H = g.clientHeight;
  const cols = Math.max(1, Math.floor((W + gap) / (smallest + gap)));
  const cw = (W - gap * (cols - 1)) / cols;
  const cap = document.querySelector(".card .cap")?.offsetHeight || 66;
  const rows = Math.max(1, Math.round((H + gap) / (cw * 0.85 + cap + gap)));
  return { cols, rows, cw, limit: Math.min(500, cols * rows) };
}

// `keep`, when given, is an asset's place in the whole list, and the page chosen is the one holding it.
async function loadAssets(page, keep) {
  const f = fit();
  if (keep != null) page = Math.floor(keep / f.limit);
  const q = new URLSearchParams({ limit: f.limit, page: page + 1 });
  if (state.type) q.set("type", state.type);
  if (state.q) q.set("q", state.q);
  for (const [k, v] of Object.entries(state.filters)) q.set("tag." + k, v);
  if (state.uses) q.set("link.used-by", state.uses);
  if (state.unused) q.set("unlinked", "used-by");
  if (state.retired) q.set("retired", state.retired);
  if (state.view) q.set("view", state.view);
  // A total reads every match, so it is asked for once per search, not on every page turn.
  const asking = state.store + "?" + q.toString().replace(/(^|&)(limit|page)=[^&]*/g, "");
  if (state.counted !== asking) q.set("count", 1);
  let got;
  try { got = await api(`${S()}/assets?${q}`); }
  catch (e) { fill($("drawer"), h("p", { className: "empty" }, e.message)); return; }
  // Past the end — an old URL, or the last asset on the last page deleted: show the last real page.
  if (!got.assets.length && got.total > 0 && page > 0) return loadAssets(0, got.total - 1);
  state.page = page;
  state.limit = f.limit;
  state.layout = f;
  if (got.total != null) { state.total = got.total; state.counted = asking; }
  state.assets = got.assets.map((x) => ({ ...x.asset, tags: x.tags }));
  renderDrawer();
  saveHash();
}

// The space changed — the window, or the detail panel opening or closing. Same number of cards:
// just reshape the grid. A different number: fetch the page that keeps the selected asset, or the
// first one showing, in view.
function relayout() {
  if (!state.layout) return;
  const f = fit();
  if (f.limit === state.limit) {
    state.layout = f;
    shape(f);
    fitCaptions();
    return;
  }
  const i = Math.max(0, state.assets.findIndex((a) => a.id === state.selected));
  loadAssets(0, state.page * state.limit + i);
}

function shape(f) {
  $("grid").style.setProperty("--cols", f.cols);
  $("grid").style.setProperty("--rows", f.rows);
}

let resized;
window.addEventListener("resize", () => { clearTimeout(resized); resized = setTimeout(relayout, 150); });

function pages() { return Math.max(1, Math.ceil(state.total / state.limit)); }

function goPage(p) {
  if (p >= 0 && p < pages() && p !== state.page) loadAssets(p);
}

function pager() {
  const n = pages();
  if (n <= 1) return null;
  return h("nav", { className: "pager", "aria-label": "Pages" },
    h("button", { className: "plain", disabled: state.page === 0, onclick: () => goPage(state.page - 1) }, "← Previous"),
    h("label", null, "Page ",
      h("input", { className: "pageno", type: "number", min: 1, max: n, value: state.page + 1,
        onchange: (e) => goPage(Math.min(n, Math.max(1, Math.round(Number(e.target.value) || 1))) - 1) }),
      ` of ${n}`),
    h("button", { className: "plain", disabled: state.page >= n - 1, onclick: () => goPage(state.page + 1) }, "Next →"));
}

function renderDrawer() {
  skeleton();
  const chip = (label, remove) => h("span", { className: "chip" }, label,
    h("button", { "aria-label": `Remove ${label}`, onclick: remove }, "×"));
  const chips = [
    state.q ? chip(`“${state.q}”`, () => { $("q").value = ""; search(); }) : null,
    state.uses ? chip(`used by ${state.uses}`, () => setUse(null, false)) : null,
    state.unused ? chip("used by nothing", () => setUse(null, false)) : null,
    state.retired ? chip(state.retired === "only" ? "retired only" : "with retired", () => { setRetired(null); refreshUse(); }) : null,
    state.view ? chip(`seen ${state.view}`, () => setView(null)) : null,
    ...Object.entries(state.filters).map(([k, v]) => chip(`${k}=${v}`, () => setFilter(k, null))),
  ].filter(Boolean);
  const first = state.page * state.limit + 1, last = state.page * state.limit + state.assets.length;
  fill($("status"),
    h("button", { className: "plain filtertoggle", onclick: () => document.body.classList.add("showfilters") }, "Filters"),
    h("span", { className: "count" }, `${state.total} ${state.type || (state.total === 1 ? "asset" : "assets")}`),
    pages() > 1 ? h("span", { className: "mute" }, `showing ${first}–${last}`) : null,
    ...chips,
    chips.length > 1 ? h("button", { className: "tiny", onclick: clearFilters }, "clear all") : null,
    h("span", { style: "flex:1" }),
    pager());
  shape(state.layout);
  if (!state.assets.length) {
    fill($("grid"), h("p", { className: "empty" },
      chips.length ? "Nothing matches all of these. Remove one to widen the search." : `${state.store} has no ${state.type || "assets"}.`));
    return;
  }
  fill($("grid"), ...state.assets.map(card));
  fitCaptions();
}

function card(a) {
  let well;
  if (isRaster(a.content_type) && a.file_hash) {
    well = h("div", { className: "well" }, h("img", {
      src: thumbURL(a, state.layout ? state.layout.cw : 180), alt: "", decoding: "async",
      onerror: (e) => { e.target.remove(); well.classList.add("missing"); },
    }));
  } else if (/^image\//.test(a.content_type)) {
    well = h("div", { className: "well" }, h("img", {
      src: objectURL(a), alt: "",
      onerror: (e) => { e.target.remove(); well.classList.add("missing"); },
    }));
  } else {
    well = h("div", { className: "well" }, h("span", { className: "glyph" }, glyph(a)));
  }
  const current = a.id === state.selected;
  const el = h("div", { className: "card" + (current ? " current" : "") + (a.retired_at ? " retired" : ""), "data-id": a.id },
    h("button", { className: "hit", "aria-current": String(current), title: caption(a), onclick: () => select(a.id) },
      well,
      h("span", { className: "cap" },
        h("span", { className: "t", "data-full": caption(a) }, caption(a)),
        h("span", { className: "s" }, h("span", null, "#" + a.id), state.type ? null : h("span", null, a.asset_type),
          a.retired_at ? h("span", null, "retired") : null,
          a.rating ? h("span", null, "★".repeat(a.rating)) : null))),
    a.flagged ? h("span", { className: "flag", title: "Flagged" }) : null);
  if (a.media === "audio") {
    const play = h("button", { className: "play", "aria-label": `Play #${a.id}`, "aria-pressed": "false" }, "▶");
    play.addEventListener("click", () => playInCard(a, play));
    el.append(play);
  }
  return el;
}

const player = new Audio();
let playing = null;
function playInCard(a, btn) {
  if (playing === btn && !player.paused) { player.pause(); return; }
  if (playing) { playing.setAttribute("aria-pressed", "false"); playing.textContent = "▶"; }
  playing = btn;
  player.src = objectURL(a);
  player.play().catch((e) => toast(`Can't play #${a.id}: ${e.message}`, true));
  btn.setAttribute("aria-pressed", "true"); btn.textContent = "❚❚";
}
player.addEventListener("pause", () => { if (playing) { playing.setAttribute("aria-pressed", "false"); playing.textContent = "▶"; } });
player.addEventListener("ended", () => { if (playing) { playing.setAttribute("aria-pressed", "false"); playing.textContent = "▶"; } });

// ── one asset ──────────────────────────────────────────────────────────────────────────────────

async function select(id) {
  state.selected = id;
  markCurrent(id);
  if ($("detail").hidden) { $("main").classList.add("detailed"); $("detail").hidden = false; relayout(); }
  saveHash();
  try { state.record = await api(`${S()}/assets/${id}`); }
  catch (e) { fill($("detail"), h("p", { className: "body" }, e.message)); return; }
  state.editing = null;
  renderDetail();
}

// `quiet` when the caller is about to load a page anyway, so the grid is not fetched twice.
function closeDetail(quiet) {
  state.selected = null; state.record = null; state.editing = null;
  const was = !$("detail").hidden;
  if (was) { $("main").classList.remove("detailed"); $("detail").hidden = true; }
  markCurrent(null);
  if (!quiet) { if (was) relayout(); saveHash(); }
}

function markCurrent(id) {
  for (const c of document.querySelectorAll(".card")) {
    const on = Number(c.dataset.id) === id;
    c.classList.toggle("current", on);
    c.querySelector(".hit").setAttribute("aria-current", String(on));
  }
}

function preview(a) {
  if (/^image\//.test(a.content_type)) {
    const src = isRaster(a.content_type) && a.file_hash ? thumbURL(a, 380) : objectURL(a);
    return h("img", { src, alt: caption(a, state.record.tags), onerror: (e) => e.target.replaceWith(h("p", { className: "mute" }, "The store has no object for this asset.")) });
  }
  if (a.media === "audio") return h("audio", { controls: true, preload: "metadata", src: objectURL(a) });
  if (a.media === "video") return h("video", { controls: true, preload: "metadata", src: objectURL(a) });
  if (a.media === "text" || /^(text\/|application\/json)/.test(a.content_type)) {
    const pre = h("pre", null, "Loading…");
    fetch(objectURL(a)).then((r) => r.ok ? r.text() : Promise.reject(new Error("The store has no object for this asset.")))
      .then((t) => { pre.textContent = t.length > 200000 ? t.slice(0, 200000) + "\n…" : t; })
      .catch((e) => { pre.textContent = e.message; });
    return pre;
  }
  return h("span", { className: "glyph", style: "font: 600 48px var(--display); color: var(--mute)" }, glyph(a));
}

function renderDetail() {
  const { asset: a, tags, custom, meta } = state.record;
  const ed = state.editing;
  const canEdit = updating();

  const tagRows = ed
    ? ed.rows.map(([k, v], i) => h("tr", null,
        h("td", { className: "k" }, h("input", { value: k, "aria-label": "Tag name", oninput: (e) => { ed.rows[i][0] = e.target.value; } })),
        h("td", { className: "v" }, h("input", { value: v, "aria-label": `Value of ${k}`, oninput: (e) => { ed.rows[i][1] = e.target.value; } })),
        h("td", { className: "x" }, h("button", { className: "tiny", "aria-label": `Remove ${k}`, onclick: () => { ed.rows.splice(i, 1); renderDetail(); } }, "×"))))
    : sortedTags(tags).map(([k, v]) => h("tr", null,
        h("td", { className: "k" }, k),
        h("td", { className: "v" }, v, custom.includes(k) ? h("span", { className: "badge custom", title: "A value outside the type's usual choices" }, "custom") : null),
        h("td", { className: "x" }, canEdit && custom.includes(k)
          ? h("button", { className: "plain", title: `Treat ${k}=${v} as a standard value for every ${a.asset_type}`, onclick: () => promote(k, v) }, "Make standard") : null)));

  const facts = [
    ["type", a.asset_type], ["media", a.content_type],
    meta && meta.width ? ["size", `${meta.width} × ${meta.height}`] : null,
    meta && meta.duration_ms ? ["length", `${(meta.duration_ms / 1000).toFixed(1)} s`] : null,
    ["index key", a.pool_key], ["pool", a.pool ? "yes, interchangeable" : null],
    ["hash", a.file_hash], ["object", a.file_path],
    ["made", a.made_at], ["stored", a.created_at], ["retired", a.retired_at],
    ["last used", a.last_used_at], ["uses", a.use_count || null],
    ["generated", a.generated ? (a.generator || "yes") : null],
    ["permanent", a.permanent ? "yes" : null],
  ].filter((f) => f && f[1] != null && f[1] !== "");

  const body = h("div", { className: "body" },
    h("div", null,
      h("h2", null, caption(a, tags)),
      h("div", { className: "sub" }, `#${a.id} · ${a.asset_type} · ${state.store}`),
    ),
    h("div", { className: "links" },
      h("a", { href: objectURL(a), target: "_blank", rel: "noopener" }, "Open original"),
      h("a", { href: objectURL(a, true) }, "Download")),
    a.retired_at ? h("p", { className: "note" }, `Retired ${a.retired_at}: hidden from listings and search, and kept. `,
      canEdit ? h("button", { className: "plain", onclick: () => setRetirement(a, false) }, "Reinstate") : null) : null,
    !writable() ? h("p", { className: "note" }, `${state.store} is read-only here: curio's config gives it no write token.`)
      : !canEdit ? h("p", { className: "note" }, "Turn on update mode to change this asset.") : null,

    h("div", null,
      h("p", { className: "eyebrow" }, "Tags"),
      h("table", { className: "tags" }, h("tbody", null, ...tagRows,
        ed ? h("tr", null, h("td", { colSpan: 3 }, h("button", { className: "tiny", onclick: () => { ed.rows.push(["", ""]); renderDetail(); } }, "+ add a tag"))) : null)),
      !ed && !Object.keys(tags).length ? h("p", { className: "mute" }, "No tags.") : null),

    h("div", null,
      h("p", { className: "eyebrow" }, "Description"),
      ed ? h("textarea", { value: ed.description, "aria-label": "Description", oninput: (e) => { ed.description = e.target.value; } })
         : a.description ? h("p", { className: "desc" }, a.description) : h("p", { className: "mute" }, "None.")),

    h("div", { className: "row" },
      h("span", { className: "eyebrow", style: "margin:0" }, "Rating"),
      stars(ed ? ed.rating : a.rating, canEdit, (n) => { if (ed) { ed.rating = n; renderDetail(); } else quick({ rating: n }); }),
      h("span", { className: "eyebrow", style: "margin:0 0 0 12px" }, "Flag"),
      h("button", {
        className: "plain", disabled: !canEdit, "aria-pressed": String(ed ? ed.flagged : a.flagged),
        onclick: () => { if (ed) { ed.flagged = !ed.flagged; renderDetail(); } else quick({ flagged: !a.flagged }); },
      }, (ed ? ed.flagged : a.flagged) ? "⚑ Flagged" : "Not flagged")),

    canEdit ? h("div", { className: "row" },
      ed ? [h("button", { className: "plain go", onclick: save }, "Save changes"),
            h("button", { className: "plain", onclick: () => { state.editing = null; renderDetail(); } }, "Cancel")]
         : h("button", { className: "plain", onclick: edit }, "Edit tags and description"),
      h("span", { style: "flex:1" }),
      a.retired_at ? null : h("button", { className: "plain", title: "Hide it from listings and search, and keep it; reinstate undoes it",
        onclick: () => setRetirement(a, true) }, "Retire"),
      h("button", { className: "plain danger", onclick: remove }, "Delete asset")) : null,

    linksSection(a, canEdit),
    a.media === "image" ? pictureSection(state.record, canEdit) : null,

    h("div", null, h("p", { className: "eyebrow" }, "Record"),
      h("dl", { className: "facts" }, ...facts.flatMap(([k, v]) => [h("dt", null, k), h("dd", null, String(v))]))),
    a.generation ? h("details", { className: "gen" }, h("summary", null, "How it was generated"), h("pre", null, pretty(a.generation))) : null,
  );

  fill($("detail"), 
    h("div", { className: "preview" }, preview(a),
      h("button", { className: "close", "aria-label": "Close", onclick: () => closeDetail() }, "×")),
    body);
}

// A registered type's key traits first, in key order, then the rest — the same order everywhere,
// so a row being edited is where it was when it was read.
function sortedTags(tags) {
  const reg = registration();
  const traits = (reg && reg.pool_traits) || [];
  const order = (k) => { const i = traits.indexOf(k); return i < 0 ? 999 : i; };
  return Object.entries(tags).sort(([x], [y]) => order(x) - order(y) || x.localeCompare(y));
}
// An asset's links: what it links to (`used-by` boardwalk, `derived-from` #12) and what links to it.
// In update mode a link can be added — a name, or #id for another asset — or removed.
function linksSection(a, canEdit) {
  const links = state.record.links || { from: [], to: [] };
  const ref = (id) => h("button", { className: "tiny", title: `Open #${id}`, onclick: () => select(id) }, "#" + id);
  const rows = [
    ...links.from.map((l) => h("tr", null,
      h("td", { className: "k" }, l.rel),
      h("td", { className: "v" }, l.to_name != null ? l.to_name : ref(l.to_id),
        l.data ? h("span", { className: "mono mute", style: "display:block; font-size:11.5px" }, JSON.stringify(l.data)) : null),
      h("td", { className: "x" }, canEdit ? h("button", {
        className: "tiny", "aria-label": `Remove ${l.rel} ${l.to_name ?? "#" + l.to_id}`, onclick: () => unlinkIt(a.id, l),
      }, "×") : null))),
    ...links.to.map((l) => h("tr", null,
      h("td", { className: "k" }, l.rel),
      h("td", { className: "v" }, ref(l.from_id), " links here"),
      h("td", { className: "x" }))),
  ];
  return h("div", null,
    h("p", { className: "eyebrow" }, "Links"),
    rows.length ? h("table", { className: "tags" }, h("tbody", null, ...rows)) : h("p", { className: "mute" }, "No links."),
    canEdit ? linkAdder(a.id) : null);
}

/* WHAT THE PICTURE IS LIKE: real fields, as opposed to tags. DataDungeon measures some (size,
 * transparency, dominant colour, the box around the visible pixels); the rest say how the picture was
 * asked for — the view, the light, where it stands, how big the thing really is — and are set here,
 * which is also where "as asked" gets corrected when the picture came out otherwise. */
function pictureSection(record, canEdit) {
  const m = record.meta || {};
  const turn = (d) => d ? `${d.name}  (${d.side}, yaw ${num(d.yaw)}, pitch ${num(d.pitch)}${d.roll ? `, roll ${num(d.roll)}` : ""})` : null;
  const rows = [
    ["size", m.width ? `${m.width} × ${m.height} px` : null],
    ["visible", m.content_w ? `${m.content_w} × ${m.content_h} px at ${m.content_x}, ${m.content_y}` : null],
    ["transparent", m.transparent == null ? null : m.transparent ? "yes, a cut-out" : "no"],
    ["colour", m.dominant_color ? h("span", null, h("span", { className: "swatch", style: `background:${m.dominant_color}` }), m.dominant_color) : null],
    ["view", turn(record.view)],
    ["light from", turn(record.light)],
    ["anchor", m.anchor_x != null ? `${num(m.anchor_x)}, ${num(m.anchor_y)}` : null],
    ["real size", [m.world_width, m.world_height, m.world_depth].some((v) => v != null)
      ? `${[m.world_width, m.world_height, m.world_depth].map((v) => v == null ? "?" : num(v)).join(" × ")} m (w × h × d)` : null],
  ].filter(([, v]) => v != null);
  return h("div", null,
    h("p", { className: "eyebrow" }, "Picture"),
    rows.length ? h("dl", { className: "facts" }, ...rows.flatMap(([k, v]) => [h("dt", null, k), h("dd", null, v)]))
      : h("p", { className: "mute" }, m.measured ? "Nothing recorded." : "Not measured yet. Store health can measure it."),
    canEdit ? pictureEditor(record) : null);
}

function num(v) { return Number(v).toFixed(3).replace(/\.?0+$/, ""); }

function pictureEditor(record) {
  const m = record.meta || {};
  const field = (value, step, label, min, max) => h("input", { type: "number", step, min, max, value: value ?? "", "aria-label": label });
  const direction = (label, d) => {
    const side = h("select", { "aria-label": `${label} side` }, ...["front", "back"].map((v) => h("option", { value: v, selected: (d?.side || "front") === v }, v)));
    const yaw = field(d?.yaw, 0.125, `${label} yaw`, -1, 1), pitch = field(d?.pitch, 0.125, `${label} pitch`, -1, 1), roll = field(d?.roll, 0.125, `${label} roll`, -2, 2);
    const preset = h("select", { "aria-label": `${label} preset`, onchange: (e) => {
      const p = PRESETS[e.target.value]; if (!p) return;
      side.value = p[0]; yaw.value = p[1]; pitch.value = p[2];
    } }, h("option", { value: "" }, "preset…"), ...Object.keys(PRESETS).map((n) => h("option", { value: n }, n)));
    const read = () => yaw.value === "" && pitch.value === "" ? null
      : { side: side.value, yaw: Number(yaw.value || 0), pitch: Number(pitch.value || 0), roll: Number(roll.value || 0) };
    return { read, row: h("div", { className: "row" }, h("span", { className: "what" }, label), preset, side,
      h("label", null, "yaw", yaw), h("label", null, "pitch", pitch), h("label", null, "roll", roll)) };
  };
  const view = direction("view", record.view), light = direction("light", record.light);
  const ax = field(m.anchor_x, 0.01, "anchor x", 0, 1), ay = field(m.anchor_y, 0.01, "anchor y", 0, 1);
  const ww = field(m.world_width, 0.1, "real width", 0), wh = field(m.world_height, 0.1, "real height", 0), wd = field(m.world_depth, 0.1, "real depth", 0);
  const foot = m.content_w ? h("button", { className: "tiny", title: "The bottom centre of the visible pixels",
    onclick: () => { ax.value = num((m.content_x + m.content_w / 2) / m.width); ay.value = num((m.content_y + m.content_h) / m.height); } },
    "at its foot") : null;
  const save = async () => {
    const image = {};
    const v = view.read(), l = light.read();
    if (v) image.view = v;
    if (l) image.light = l;
    for (const [k, el] of [["anchor_x", ax], ["anchor_y", ay], ["world_width", ww], ["world_height", wh], ["world_depth", wd]])
      if (el.value !== "") image[k] = Number(el.value);
    if (!Object.keys(image).length) return toast("Nothing to save: fill in a view, light, anchor or size.", true);
    patch({ image }, "Picture saved.");
  };
  return h("div", { className: "picedit" },
    view.row, light.row,
    h("div", { className: "row" }, h("span", { className: "what" }, "anchor"), h("label", null, "x", ax), h("label", null, "y", ay), foot),
    h("div", { className: "row" }, h("span", { className: "what" }, "real m"), h("label", null, "w", ww), h("label", null, "h", wh), h("label", null, "d", wd)),
    h("div", { className: "row" }, h("button", { className: "plain go", onclick: save }, "Save picture")));
}

function linkAdder(id) {
  const rel = h("input", { value: "used-by", "aria-label": "Relation" });
  const to = h("input", { className: "to", placeholder: "boardwalk, or #12", "aria-label": "Link to" });
  const add = async () => {
    const t = to.value.trim(), r = rel.value.trim();
    if (!t || !r) return;
    const body = /^#\d+$/.test(t) ? { rel: r, to: Number(t.slice(1)) } : { rel: r, name: t };
    try {
      await api(`${S()}/assets/${id}/links`, { method: "POST", body });
      state.record = await api(`${S()}/assets/${id}`);
      renderDetail();
      toast(`Linked ${r} ${t}.`);
    } catch (e) { toast(e.message, true); }
  };
  to.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  return h("div", { className: "row linkadd" }, rel, to, h("button", { className: "plain", onclick: add }, "Add link"));
}

async function unlinkIt(id, l) {
  const target = l.to_name != null ? `name=${enc(l.to_name)}` : `to=${l.to_id}`;
  try {
    await api(`${S()}/assets/${id}/links?rel=${enc(l.rel)}&${target}`, { method: "DELETE" });
    state.record = await api(`${S()}/assets/${id}`);
    renderDetail();
    toast(`Unlinked ${l.rel} ${l.to_name ?? "#" + l.to_id}.`);
  } catch (e) { toast(e.message, true); }
}

function pretty(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } }

function stars(n, live, set) {
  return h("span", { className: "stars", role: "group", "aria-label": n ? `Rated ${n} of 5` : "Unrated" },
    ...[1, 2, 3, 4, 5].map((i) => h("button", {
      className: i <= (n || 0) ? "on" : "", disabled: !live, "aria-label": `${i} star${i > 1 ? "s" : ""}`,
      onclick: () => set(i),
    }, "★")));
}

function edit() {
  const { asset: a, tags } = state.record;
  state.editing = { rows: sortedTags(tags), description: a.description || "", rating: a.rating, flagged: a.flagged };
  renderDetail();
}

async function patch(body, done) {
  const id = state.record.asset.id;
  try {
    const out = await api(`${S()}/assets/${id}`, { method: "PATCH", body });
    state.record = { ...state.record, asset: out.asset, tags: out.tags };
    const i = state.assets.findIndex((x) => x.id === id);
    if (i >= 0) state.assets[i] = { ...out.asset, tags: out.tags };
    state.editing = null;
    state.record = await api(`${S()}/assets/${id}`);   // custom flags and metadata, as the store now has them
    renderDetail(); renderDrawer();
    toast(done);
  } catch (e) { toast(e.message, true); }
}

function quick(body) {
  patch(body, body.rating ? `Rated ${body.rating} of 5.` : body.flagged ? "Flagged." : "Unflagged.");
}

function save() {
  const ed = state.editing, a = state.record.asset;
  const rows = ed.rows.map(([k, v]) => [k.trim(), v.trim()]).filter(([k]) => k);
  const tags = Object.fromEntries(rows);
  if (rows.length !== Object.keys(tags).length) return toast("Two tags have the same name. Rename or remove one.", true);
  const body = {};
  if (JSON.stringify(tags) !== JSON.stringify(state.record.tags)) body.tags = tags;
  if (ed.description !== (a.description || "")) body.description = ed.description;
  if (ed.rating !== a.rating && ed.rating != null) body.rating = ed.rating;
  if (ed.flagged !== a.flagged) body.flagged = ed.flagged;
  if (!Object.keys(body).length) { state.editing = null; renderDetail(); return; }
  patch(body, "Saved.");
}

async function promote(k, v) {
  try {
    const out = await api(`${S()}/types/${enc(state.type)}/promote`, { method: "POST", body: { trait: k, value: v } });
    toast(`${k}=${v} is now a standard value (${out.promoted} tag${out.promoted === 1 ? "" : "s"}).`);
    state.record = await api(`${S()}/assets/${state.record.asset.id}`);
    renderDetail();
  } catch (e) { toast(e.message, true); }
}

async function setRetirement(a, retire) {
  try {
    await api(`${S()}/assets/${a.id}/${retire ? "retire" : "reinstate"}`, { method: "POST" });
    toast(retire ? `Retired #${a.id}. Show retired to find it again.` : `Reinstated #${a.id}.`);
    state.record = await api(`${S()}/assets/${a.id}`);
    renderDetail();
    state.types = await api(`${S()}/types`).catch(() => state.types);
    renderTypes();
    state.counted = null;
    loadAssets(state.page);
  } catch (e) { toast(e.message, true); }
}

async function remove() {
  const a = state.record.asset;
  if (!confirm(`Delete #${a.id} (${caption(a, state.record.tags)}) from ${state.store}?\n\nIts object is deleted too, unless another asset shares the same bytes. This can't be undone.`)) return;
  try {
    await api(`${S()}/assets/${a.id}`, { method: "DELETE" });
    toast(`Deleted #${a.id}.`);
    closeDetail(true);
    state.types = await api(`${S()}/types`).catch(() => state.types);
    renderTypes();
    state.counted = null;
    loadAssets(state.page);
  } catch (e) { toast(e.message, true); }
}

// ── update mode ────────────────────────────────────────────────────────────────────────────────
// The key lives in this variable and nowhere else, so reloading the page is turning the switch off.

$("switch").addEventListener("click", async () => {
  if (state.key) {
    await fetch("/api/update", { method: "DELETE" }).catch(() => {});
    goLocked();
    return;
  }
  try {
    const out = await api("/api/update", { method: "POST" });
    state.key = out.key;
    state.idle = out.idle_seconds;
    state.deadline = Date.now() + state.idle * 1000;
    afterSwitch();
    if (!writable()) toast(`Update mode is on, but ${state.store} has no write token in curio's config, so it stays read-only.`);
  } catch (e) { toast(e.message, true); }
});

function goLocked(why) {
  const was = !!state.key;
  state.key = null;
  state.editing = null;
  afterSwitch();
  if (why && was) toast(why, true);
}

function afterSwitch() {
  renderSwitch();
  if (state.record) renderDetail();
  if (state.type) {
    const old = document.querySelector(".health");
    if (old) old.replaceWith(health());
  }
}

function renderSwitch() {
  const on = !!state.key;
  document.body.classList.toggle("updating", on && writable());
  $("switch").setAttribute("aria-checked", String(on));
  $("switchword").textContent = on ? "Update mode on" : "Update mode off";
  $("fuse").hidden = !on;
  tick();
}

function tick() {
  if (!state.key) { $("left").textContent = ""; return; }
  const left = Math.max(0, state.deadline - Date.now());
  if (left === 0) return goLocked(`Update mode switched itself off after ${Math.round(state.idle / 60)} idle minutes.`);
  const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
  $("left").textContent = `off in ${m}:${String(s).padStart(2, "0")} if idle`;
  $("fuse").style.transform = `scaleX(${left / (state.idle * 1000)})`;
}
setInterval(tick, 1000);

// ── keys ───────────────────────────────────────────────────────────────────────────────────────

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select")) return;
  if (e.key === "/") { e.preventDefault(); $("q").focus(); $("q").select(); return; }
  if (e.key === "Escape" && state.selected) { closeDetail(); return; }
  if ((e.key === "PageDown" || e.key === "PageUp") && state.layout) {
    e.preventDefault();
    goPage(state.page + (e.key === "PageDown" ? 1 : -1));
    return;
  }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && state.selected) {
    e.preventDefault();
    step(e.key === "ArrowRight" ? 1 : -1);
  }
});

// The next asset, turning the page when this one is the last on it.
async function step(by) {
  const i = state.assets.findIndex((a) => a.id === state.selected);
  let next = state.assets[i + by];
  if (!next) {
    const page = state.page + by;
    if (page < 0 || page >= pages()) return;
    await loadAssets(page);
    next = by > 0 ? state.assets[0] : state.assets[state.assets.length - 1];
    if (!next) return;
  }
  select(next.id);
}

start();
</script>
